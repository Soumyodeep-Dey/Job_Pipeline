services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
      POSTGRES_DB: ${POSTGRES_DB:-job_pipeline}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-job_pipeline}:${POSTGRES_PASSWORD:-local_password}@db:5432/${POSTGRES_DB:-job_pipeline}
      AUTH_USERNAME: ${AUTH_USERNAME:-owner}
      MASTER_RESUME_ID: ${MASTER_RESUME_ID:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Run python scripts/setup_local.py first}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/code/data:ro
      - ./resume:/code/resume:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      MASTER_RESUME_ID: ${MASTER_RESUME_ID:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-job_pipeline}:${POSTGRES_PASSWORD:-local_password}@db:5432/${POSTGRES_DB:-job_pipeline}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; p=pathlib.Path('/tmp/job-pipeline-worker-heartbeat'); assert p.exists() and time.time()-float(p.read_text()) < 45"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 10m
    restart: unless-stopped

volumes:
  postgres_data:
